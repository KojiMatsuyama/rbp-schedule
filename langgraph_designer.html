<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Framework Designer</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3348;
  --text: #e2e4ed;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --accent-glow: rgba(108, 140, 255, 0.25);
  --danger: #ff5c6c;
  --success: #4ecb71;
  --warn: #ffb84c;
  --cog: #6c8cff;
  --eval: #4ecb71;
  --decide: #ffb84c;
  --proj: #c084fc;
  --exec: #f472b6;
}

body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ── Sidebar（幅可変・隠せる） ── */
.sidebar {
  width: 320px;
  min-width: 180px;
  max-width: 600px;
  flex: 0 0 auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden auto;
}
.sidebar.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  border-right: none;
  overflow: hidden;
}
/* サイドメニューのリサイズハンドル（sidebar と main の間） */
.sidebar-resizer {
  width: 5px;
  flex: 0 0 auto;
  cursor: col-resize;
  background: transparent;
  position: relative;
  z-index: 4;
}
.sidebar-resizer::after {
  content: '';
  position: absolute;
  left: 2px; top: 0; bottom: 0; width: 1px;
  background: var(--border);
}
.sidebar-resizer:hover, .sidebar-resizer.active { background: var(--accent-glow); }
.sidebar-resizer:hover::after, .sidebar-resizer.active::after { background: var(--accent); }

.sidebar-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
  justify-content: center;
}
.btn:hover { border-color: var(--accent); background: var(--accent-glow); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { opacity: 0.9; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: rgba(255,92,108,0.15); }
.btn-sm { padding: 4px 8px; font-size: 11px; width: auto; }

.prop-group { margin-bottom: 10px; }
.prop-group label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.prop-input, .prop-select, .prop-textarea {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  outline: none;
}
.prop-input:focus, .prop-select:focus, .prop-textarea:focus { border-color: var(--accent); }
.prop-textarea { resize: vertical; min-height: 50px; font-family: inherit; }
.prop-select { cursor: pointer; }

.empty-state {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 12px;
}

/* ── サブメニュー: 状態遷移ネット 直接選択 ── */
.btn-jobnet { display: flex; align-items: center; gap: 8px; text-align: left; }
.btn-jobnet .nb-sub { margin-left: auto; font-size: 10px; color: var(--text-dim); }
.btn-jobnet.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-jobnet.active .nb-sub { color: rgba(255,255,255,.75); }

/* ── サブメニュー: 正（source of truth）メモ ── */
.jobnet-notes { display: flex; flex-direction: column; gap: 6px; }
.jn-row { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--text); }
.jn-row > span { flex: 0 0 34px; color: var(--text-dim); }
.jn-row code { font-size: 11px; color: var(--accent); background: var(--surface2); padding: 0 5px; border-radius: 4px; }
.jn-row.jn-warn > span { color: var(--warn); }
.jn-row.jn-warn { color: var(--warn); }

/* ── Main Area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Toolbar ── */
.toolbar {
  padding: 6px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 4px;
  align-items: center;
}
.toolbar .spacer { flex: 1; }

.tb-icon {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text);
  font-size: 15px; cursor: pointer; transition: all 0.15s;
  position: relative;
}
.tb-icon:hover { border-color: var(--accent); background: var(--accent-glow); }
.tb-icon.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-icon.accent:hover { opacity: 0.9; }
.tb-icon.danger { border-color: var(--danger); color: var(--danger); }
.tb-icon.danger:hover { background: rgba(255,92,108,0.15); }

/* ── ツールバー・タイトル（状態遷移ネット）＋ダッシュボードへ戻る ── */
.tb-title { font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; }
.tb-badge { font-size: 10px; font-weight: 500; color: var(--text-dim); padding: 1px 7px; border: 1px solid var(--border); border-radius: 10px; }
.btn-back {
  height: 32px; padding: 0 12px; margin-right: 4px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text);
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-back:hover { border-color: var(--accent); background: var(--accent-glow); }

.tb-dropdown { position: relative; }
.tb-menu {
  position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; min-width: 160px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  display: none; z-index: 50;
}
.tb-menu.open { display: block; }
.tb-menu-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 10px; border: none; border-radius: 5px;
  background: transparent; color: var(--text); font-size: 12px;
  cursor: pointer; transition: background 0.1s;
}
.tb-menu-item:hover { background: var(--surface2); }
.tb-menu-item .mi-icon { font-size: 14px; width: 20px; text-align: center; }
.tb-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* ── Canvas View ── */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
}

.dot-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
  pointer-events: none;
  z-index: 0;
}

/* SVG connection lines */
.canvas-svg {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
}
.canvas-svg path.conn {
  fill: none;
  stroke: var(--border);
  stroke-width: 2;
  pointer-events: stroke;
  cursor: pointer;
}
.canvas-svg path.conn.branch {
  stroke: var(--warn);
  stroke-dasharray: 6 3;
}
.canvas-svg path.conn.manual {
  stroke: var(--accent);
  stroke-dasharray: none;
}
.canvas-svg path.conn:hover {
  stroke: var(--danger);
  stroke-width: 3;
}

/* Temp drawing line while connecting */
.canvas-svg path.temp-conn {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-dasharray: 6 3;
  pointer-events: none;
}

/* Draggable node */
.canvas-node {
  position: absolute;
  width: 130px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: grab;
  user-select: none;
  z-index: 2;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.canvas-node:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(108,140,255,0.15);
}
.canvas-node.dragging {
  cursor: grabbing;
  z-index: 10;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border-color: var(--accent);
}
.canvas-node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.canvas-node.over-target {
  border-color: var(--success);
  box-shadow: 0 0 0 3px rgba(78,203,113,0.3);
}

.canvas-node-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border);
}
.canvas-node-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.canvas-node-name {
  font-size: 11px;
  font-weight: 600;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.canvas-node-badge {
  font-size: 8px;
  background: rgba(255,184,76,0.2);
  color: var(--warn);
  padding: 1px 4px;
  border-radius: 3px;
  flex-shrink: 0;
}
.canvas-node-body {
  padding: 4px 8px 6px;
  font-size: 9px;
  color: var(--text-dim);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.canvas-node-actions {
  display: flex;
  gap: 2px;
  padding: 4px 8px 6px;
  justify-content: flex-end;
  opacity: 0;
  transition: opacity 0.15s;
}
.canvas-node:hover .canvas-node-actions { opacity: 1; }
.cn-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface2); color: var(--text-dim);
  font-size: 11px; cursor: pointer; transition: all 0.1s;
}
.cn-btn:hover { border-color: var(--accent); color: var(--text); }
.cn-btn.del:hover { border-color: var(--danger); color: var(--danger); }

/* Connector ports */
.port {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  cursor: crosshair;
  z-index: 5;
  transition: all 0.15s;
}
.port:hover {
  transform: scale(1.4);
  border-color: var(--accent);
  background: var(--accent-glow);
}
.port.output {
  right: -7px;
  top: 50%;
  transform: translateY(-50%);
}
.port.output:hover {
  transform: translateY(-50%) scale(1.4);
}
.port.input {
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
}
.port.input:hover {
  transform: translateY(-50%) scale(1.4);
}
.port.connected {
  border-color: var(--accent);
}
.port.output.connected {
  background: var(--accent);
}
.port.input.connected {
  background: var(--accent);
}

/* Empty state */
.canvas-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 13px;
  pointer-events: none;
  z-index: 0;
}
.canvas-empty span { font-size: 11px; margin-top: 6px; }

.stage-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.stage-header:hover { background: var(--surface2); }

.stage-badge {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.stage-name {
  font-size: 14px;
  font-weight: 600;
  flex: 1;
}

.stage-desc {
  font-size: 11px;
  color: var(--text-dim);
  flex: 1;
}

.stage-actions {
  display: flex;
  gap: 4px;
}

.stage-body {
  padding: 0 14px 12px;
  display: none;
}
.stage-body.open { display: block; }

/* ── Connector Arrow ── */
.connector {
  text-align: center;
  color: var(--text-dim);
  font-size: 18px;
  padding: 2px 0;
  user-select: none;
}

/* ── Config Items ── */
.config-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg);
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}
.config-item .ci-label {
  color: var(--text-dim);
  min-width: 60px;
}
.config-item .ci-value {
  flex: 1;
  color: var(--text);
}

/* ── Branch List ── */
.branch-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  background: var(--bg);
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}
.branch-item .bi-label {
  color: var(--warn);
  font-weight: 600;
  min-width: 50px;
}
.branch-item .bi-target {
  flex: 1;
  color: var(--text);
}

/* ── Connection List in sidebar ── */
.conn-list-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  background: var(--bg);
  border-radius: 4px;
  margin-bottom: 3px;
  font-size: 11px;
}
.conn-list-item .cli-src, .conn-list-item .cli-tgt {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conn-list-item .cli-arrow {
  color: var(--text-dim);
  flex-shrink: 0;
}
.conn-list-item .cli-del {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 3px;
  background: transparent; color: var(--text-dim);
  font-size: 12px; cursor: pointer; flex-shrink: 0;
}
.conn-list-item .cli-del:hover { background: rgba(255,92,108,0.2); color: var(--danger); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90vw;
  max-width: 600px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h2 { font-size: 15px; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.code-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-family: 'Fira Code', Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text);
  overflow-x: auto;
}

/* ── Saved Graphs ── */
.saved-item {
  padding: 8px;
  background: var(--surface2);
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 11px;
}
.saved-item .si-name { font-weight: 600; margin-bottom: 3px; }
.saved-item .si-meta { color: var(--text-dim); margin-bottom: 5px; }
.saved-item .si-actions { display: flex; gap: 4px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 状態遷移ネット（Petri網）ビュー ── */
/* ── 状態遷移ネット（Petri網）メインビュー ── */
.petri-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.petri-header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
.petri-header h2 { font-size: 14px; }
.petri-header .petri-sub { font-size: 11px; color: var(--text-dim); }
.petri-body { flex: 1; overflow: auto; position: relative; display: flex; }
/* 凡例はキャンバス右上のオーバーレイ。図（処方・在庫チェック等）と重なるため、
   既定は折りたたみ＋ヘッダをドラッグで任意位置へ移動可能にする。 */
.petri-legend { position: absolute; top: 12px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0; font-size: 11px; color: var(--text-dim); z-index: 3; min-width: 236px; }
.petri-legend .lg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; cursor: grab; user-select: none; border-bottom: 1px solid var(--border); }
.petri-legend .lg-head:active { cursor: grabbing; }
.petri-legend .lg-head .lg-title { font-weight: 700; color: var(--text); }
.petri-legend .lg-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; line-height: 1; padding: 2px 4px; }
.petri-legend .lg-close:hover { color: var(--text); }
.petri-legend .lg-body { padding: 8px 12px; line-height: 2; }
.petri-legend .lg-row { display: flex; align-items: center; gap: 8px; }
/* HUMOS ログパネル（発火ログ・作動ログ・マーキング） */
/* .petri-legend の top:12px を上書きして右下配置。top と bottom が両方効くと
   パネルが縦に伸びて図を隠す（折りたたみ時の bottom:12px と衝突）ため top:auto。 */
#petriHumos { top: auto; bottom: 12px; }
/* 真界（TN）パネルは左サイドバー（フロー内で幅を確保し、ペトリネットと重ならない）。
   .petri-body が flex 行（tn=左・canvas=右）で、サイドバーは縦に伸び内部スクロール。 */
#petriTn { position: static; flex: 0 0 340px; width: 340px; margin: 12px 0 12px 16px; overflow: hidden; display: flex; flex-direction: column; }
#petriTn .lg-body { max-height: none; overflow: auto; flex: 1; min-height: 0; }
#petriTn.tn-collapsed { flex: 0 0 auto; width: auto; min-width: 0; }
#petriCanvas { flex: 0 0 auto; }
.petri-legend .lg-sec { font-weight: 700; color: var(--text); margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
.petri-legend .lg-sec:first-child { margin-top: 0; border-top: none; padding-top: 0; }
.petri-legend .lg-log { font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.6; word-break: break-all; }
.petri-legend .lg-log .ll-tid { color: var(--accent); font-weight: 700; }
.petri-legend .lg-log .ll-ts { color: var(--text-dim); }
.petri-legend .lg-badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 700; }
.petri-legend .lg-badge.ok { background: rgba(74,222,128,.15); color: var(--success); }
.petri-legend .lg-badge.bad { background: rgba(248,113,113,.15); color: var(--warn); }
.petri-legend .lg-empty { color: var(--text-dim); font-style: italic; }
.petri-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.petri-place { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cog); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 2; }
.petri-place.enabled { border-color: var(--success); box-shadow: 0 0 8px var(--success); }
.petri-place .pp-name { font-size: 10px; font-weight: 600; padding: 0 6px; line-height: 1.25; }
.petri-place .pp-val { font-size: 8px; color: var(--success); margin-top: 2px; }
/* 外部キー: モジュール間（認知→評価→決定→投射）の内部データ。本当のプレース（境界）ではなく、
   破線・別色（オレンジ）で区別して表示（= プレース概念と区別する「キー」）。 */
.petri-place.petri-key { border-style: dashed; border-color: var(--warn); }
.petri-place.petri-key.enabled { border-color: var(--warn); box-shadow: 0 0 8px var(--warn); }
.petri-place.petri-key .pp-key { font-size: 7px; font-weight: 700; color: var(--warn); margin-top: 1px; letter-spacing: .2px; }
.petri-place.petri-key .pp-val { color: var(--warn); }
.petri-node-box { position: absolute; background: var(--surface2); border: 1.5px solid var(--accent); border-radius: 6px; min-height: 50px; padding: 6px 8px; text-align: center; z-index: 2; }
.petri-node-box.enabled { border-color: var(--success); box-shadow: 0 0 8px var(--success); }
.petri-node-box.disabled { opacity: .55; }
.petri-node-box .pn-name { font-size: 11px; font-weight: 600; line-height: 1.3; }
.petri-node-box .pn-sub { font-size: 9px; color: var(--text-dim); margin-top: 3px; word-break: break-all; }
.petri-action { position: absolute; font-size: 9px; color: var(--exec); border: 1px solid var(--exec); border-radius: 4px; padding: 1px 6px; z-index: 2; white-space: nowrap; }
.petri-frame { position: absolute; border: 2px dashed var(--proj); border-radius: 10px; z-index: 1; cursor: pointer; }
.petri-frame-label { position: absolute; font-size: 11px; font-weight: 700; color: var(--proj); padding: 2px 8px; background: var(--bg); border-radius: 4px; z-index: 4; white-space: nowrap; cursor: pointer; }
</style>
</head>
<body>

<!-- ═══ Sidebar（サブメニュー）═══ -->
<div class="sidebar" id="sidebar">
  <!-- 状態遷移ネット（直接選択） -->
  <div class="sidebar-section">
    <h3>ネットを選択</h3>
    <button class="btn btn-jobnet active" id="navJobnet" onclick="openPetriView()">
      <span style="color:var(--accent)">🕸</span> 状態遷移ネット
      <span class="nb-sub">プレース × トランジション</span>
    </button>
  </div>

  <!-- 正（single source of truth） -->
  <div class="sidebar-section">
    <h3>正（Single Source of Truth）</h3>
    <div class="jobnet-notes">
      <div class="jn-row"><span>構造</span><code>jobnet.py</code></div>
      <div class="jn-row"><span>発火</span>マーキング駆動ループ（run_net / enabled_when）</div>
      <div class="jn-row"><span>取得</span><code>GET /api/net</code></div>
      <div class="jn-row jn-warn"><span>編集</span>read-only（正=jobnet.py）</div>
    </div>
  </div>
</div>

<!-- サイドメニューのリサイズハンドル（ドラッグで幅変更） -->
<div class="sidebar-resizer" id="sidebarResizer" title="ドラッグで幅変更"></div>

<!-- ═══ Main ═══ -->
<div class="main">
  <div class="toolbar">
    <button class="tb-icon" id="sidebarToggle" onclick="toggleSidebar()" title="サイドメニューの表示/非表示">☰</button>
    <button class="btn-back" onclick="window.location.href='/'" title="トップポータルへ戻る">← ポータル</button>
    <span class="tb-title">🕸 状態遷移ネット <span class="tb-badge">正 = jobnet.py</span></span>
    <div class="spacer"></div>
    <button class="tb-icon" onclick="openPetriView()" title="再読み込み（/api/net）">🔄</button>
  </div>

  <!-- 状態遷移ネット（Petri網）メインビュー — read-only（正=jobnet.py） -->
  <div class="petri-view" id="petriView">
    <div class="petri-header">
      <h2 id="petriTitle">状態遷移ネット（読み込み中…）</h2>
      <span class="petri-sub">正 = <code>jobnet.py</code>（read-only）• 発火＝マーキング駆動ループ（run_net / enabled_when）• 緑=現在発火可能</span>
    </div>
    <div class="petri-body" id="petriBody"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════

function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escPy(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }
function camelCase(s) { return s.replace(/[^\w]/g,'_').replace(/^_+|_+$/g,'').replace(/_./g,m=>m[1].toUpperCase()); }

// ═══════════════════════════════════════════
// サイドメニュー（幅可変・隠せる）
// ═══════════════════════════════════════════
const SIDEBAR_MIN = 180, SIDEBAR_MAX = 600, SIDEBAR_DEFAULT = 320;
let _sidebarW = SIDEBAR_DEFAULT;

function _lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function _lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function applySidebarWidth() {
  const sb = document.getElementById('sidebar');
  if (sb) sb.style.width = _sidebarW + 'px';
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const rz = document.getElementById('sidebarResizer');
  if (!sb) return;
  const collapsed = sb.classList.toggle('collapsed');
  if (rz) rz.style.display = collapsed ? 'none' : '';
  _lsSet('stb_sidebar_collapsed', collapsed ? '1' : '0');
}

// リサイズハンドルをドラッグで幅変更（SIDEBAR_MIN〜MAX にクランプ）。
function sidebarResizerDragStart(e) {
  e.preventDefault();
  const rz = document.getElementById('sidebarResizer');
  const wasCollapsed = document.getElementById('sidebar').classList.contains('collapsed');
  if (wasCollapsed) toggleSidebar(); // 非表示中はドラッグで再表示
  if (rz) rz.classList.add('active');
  function onMove(ev) {
    _sidebarW = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, ev.clientX));
    applySidebarWidth();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (rz) rz.classList.remove('active');
    _lsSet('stb_sidebar_width', String(_sidebarW));
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// 起動時: 保存済み幅・表示状態を復元。
function initSidebar() {
  _sidebarW = parseInt(_lsGet('stb_sidebar_width', String(SIDEBAR_DEFAULT)), 10) || SIDEBAR_DEFAULT;
  _sidebarW = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, _sidebarW));
  applySidebarWidth();
  if (_lsGet('stb_sidebar_collapsed', '0') === '1') {
    const sb = document.getElementById('sidebar');
    const rz = document.getElementById('sidebarResizer');
    if (sb) sb.classList.add('collapsed');
    if (rz) rz.style.display = 'none';
  }
  const rz = document.getElementById('sidebarResizer');
  if (rz) rz.addEventListener('mousedown', sidebarResizerDragStart);
}

// ═══════════════════════════════════════════
// 状態遷移ネット（Petri網）ビュー — read-only（正=jobnet.py）
// プレース（丸）・トランジション（縦棒）・弧（矢線）・複合トランジション
// （薬剤選定{認知─評価─決定─投射}＋作動Slack）・作動・発火可能ハイライト。
// ═══════════════════════════════════════════

let PETRI_NET = null;   // /api/net の JSON
let PETRI_HUMOS = null; // /api/humos の JSON（マーキング・発火ログ・作動ログ）
let PETRI_EXPANDED = false; // 複合トランジションを内側チェーンへ展開したか
let PETRI_LEGEND_OPEN = false; // 凡例は既定折りたたみ（図と重ならないため）
let PETRI_LEGEND_POS = null;   // ドラッグ後の位置 {left, top}（再描画で保持）
let PETRI_HUMOS_OPEN = false;  // HUMOS ログは既定折りたたみ（凡例と同様）
let PETRI_HUMOS_POS = null;    // ドラッグ後の位置 {left, top}（再描画で保持）
let PETRI_TN_OPEN = true;      // 真界（TN）パネルは既定展開（真界の完成を一目で）
let PETRI_TN_POS = null;       // ドラッグ後の位置 {left, top}（再描画で保持）

function petriLegendToggle() { PETRI_LEGEND_OPEN = !PETRI_LEGEND_OPEN; renderPetri(); }
function petriHumosToggle() { PETRI_HUMOS_OPEN = !PETRI_HUMOS_OPEN; renderPetri(); }
function petriTnToggle() { PETRI_TN_OPEN = !PETRI_TN_OPEN; renderPetri(); }

// 浮動パネル（凡例・HUMOSログ）のヘッダをドラッグで移動（キャンバス内に収める）。
// panelId = 'petriLegend' | 'petriHumos'、posKey = 保持用変数の名。
function petriPanelDragStart(e, panelId, posKey) {
  e.preventDefault();
  const panel = document.getElementById(panelId);
  const head = document.getElementById(panelId + 'Head');
  if (!panel || !head) return;
  const body = document.getElementById('petriBody');
  const rect = panel.getBoundingClientRect();
  const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
  function onMove(ev) {
    const br = body.getBoundingClientRect();
    let x = ev.clientX - br.left - ox + body.scrollLeft;
    let y = ev.clientY - br.top - oy + body.scrollTop;
    x = Math.max(0, Math.min(x, body.scrollWidth - panel.offsetWidth));
    y = Math.max(0, Math.min(y, body.scrollHeight - panel.offsetHeight));
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
    panel.style.right = 'auto';
    if (posKey === 'PETRI_LEGEND_POS') PETRI_LEGEND_POS = { left: x, top: y };
    else if (posKey === 'PETRI_TN_POS') PETRI_TN_POS = { left: x, top: y };
    else PETRI_HUMOS_POS = { left: x, top: y };
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function petriLegendDragStart(e) { petriPanelDragStart(e, 'petriLegend', 'PETRI_LEGEND_POS'); }
function petriHumosDragStart(e) { petriPanelDragStart(e, 'petriHumos', 'PETRI_HUMOS_POS'); }

// HUMOS（土壌）の記録ログを取得（/api/humos）。
async function loadHumosLog() {
  try {
    const res = await fetch('/api/humos');
    PETRI_HUMOS = await res.json();
  } catch (e) {
    PETRI_HUMOS = { error: e.message, marking: {}, firing_log: [], sos_log: [], replay_ok: false };
  }
}

// 発火ログ・作動ログの行を HTML に（新しい順・最大20件）。
function humosLogRows() {
  const H = PETRI_HUMOS || {};
  const N = PETRI_NET || {};
  const tname = (tid) => (N.transitions && N.transitions[tid] && N.transitions[tid].name) || tid;
  const fmtTs = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString('ja-JP', { hour12: false }) : '';
  const trunc = (v, n) => { const s = typeof v === 'string' ? v : JSON.stringify(v); return s.length > n ? s.slice(0, n) + '…' : s; };

  let firing = '';
  const fl = (H.firing_log || []).slice(-20).reverse();
  if (!fl.length) firing = '<div class="lg-empty">発火ログなし（まだ run_net が走っていない）</div>';
  else fl.forEach(e => {
    const gen = Object.keys(e.generated || {});
    firing += `<div class="lg-log"><span class="ll-ts">${fmtTs(e.ts)}</span> <span class="ll-tid">${escHtml(tname(e.tid))}</span> → ${escHtml(gen.length ? gen.join(', ') : '—')}</div>`;
  });

  let sos = '';
  const sl = (H.sos_log || []).slice(-20).reverse();
  if (!sl.length) sos = '<div class="lg-empty">作動ログなし</div>';
  else sl.forEach(e => {
    const ok = e.result && e.result.success;
    sos += `<div class="lg-log"><span class="ll-ts">${fmtTs(e.ts)}</span> <span class="ll-tid">${escHtml(e.action)}</span> ${ok ? '<span class="lg-badge ok">OK</span>' : '<span class="lg-badge bad">NG</span>'} ${escHtml(trunc(e.result, 60))}</div>`;
  });

  let marking = '';
  const mk = H.marking || {};
  const keys = Object.keys(mk);
  if (!keys.length) marking = '<div class="lg-empty">マーキングなし</div>';
  else keys.forEach(k => {
    const has = mk[k] != null && mk[k] !== '' && !(Array.isArray(mk[k]) && mk[k].length === 0);
    marking += `<div class="lg-log">${has ? '●' : '○'} <span class="ll-tid">${escHtml(k)}</span> ${has ? escHtml(trunc(mk[k], 40)) : ''}</div>`;
  });
  return { firing, sos, marking };
}

// 真界（TrueNet / TN）可視化: 共有 OS 上の「生きた状態」を一目で。
// 発火順序（マーキング駆動）/ 在庫リフレックス（間接的開き）/ リプレイ整合 / OS 同一性。
// 既存の「HUMOS ログ」パネル（生ログ）と対: ここは完成した真界の「見方」。
function trueNetRows() {
  const H = PETRI_HUMOS || {};
  const N = PETRI_NET || {};
  const tname = (tid) => (N.transitions && N.transitions[tid] && N.transitions[tid].name) || tid;
  const fl = H.firing_log || [];

  // 発火順序（時系列・マーキング駆動のステップ順）
  let order = '';
  if (!fl.length) order = '<div class="lg-empty">発火ログなし（まだ run_net が走っていない）</div>';
  else fl.forEach((e, i) => {
    const gen = Object.keys(e.generated || {});
    const reflex = gen.indexOf('inventory_token') >= 0;
    order += `<div class="lg-log"><span class="ll-ts">${i + 1}.</span> <span class="ll-tid">${escHtml(tname(e.tid))}</span>${reflex ? ' <span class="lg-badge ok" title="在庫リフレックス（間接的開き）">↻</span>' : ''} → ${escHtml(gen.length ? gen.join(', ') : '—')}</div>`;
  });

  // 在庫リフレックス（間接的開き）: T_rx_exec が place_token で在庫トークンを置き、
  // ループがライブマーキング再読で T_inventory を発火させる（§4.3）。
  const fired = {}; fl.forEach(e => { fired[e.tid] = e; });
  let reflex = '';
  if (fired['T_rx_exec'] && fired['T_inventory']) {
    const rxGen = Object.keys(fired['T_rx_exec'].generated || {});
    const viaReflex = rxGen.indexOf('inventory_token') >= 0;
    reflex = `<div class="lg-row"><span class="lg-badge ok">間接的開き</span> <span class="lg-log">T_rx_exec（Slack送信）→ <b>place_token</b>（${viaReflex ? 'リフレックス差分' : '生成'}）→ T_inventory 発火</span></div>`;
  } else {
    reflex = '<div class="lg-row lg-empty">在庫リフレックス未発火（処方が空 or Slack送信失敗）</div>';
  }

  // リプレイ整合（不変条件5: マーキング ≡ M0 からのリプレイ）
  const replay = H.replay_ok
    ? '<div class="lg-row"><span class="lg-badge ok">整合</span> <span class="lg-log">マーキング ≡ M0 からのリプレイ</span></div>'
    : '<div class="lg-row"><span class="lg-badge bad">未整合</span> <span class="lg-log">マーキング ≠ リプレイ（整合違反）</span></div>';

  // OS 同一性（DC と STB が同一の共有 OS で稼働する根拠）
  const os = `<div class="lg-row"><span class="lg-log">共有 OS <b>humos_os</b>（DC/STB 同一）</span></div>
    <div class="lg-row"><span class="lg-log">net_id = <b>stb</b>（単一インスタンス）</span></div>
    <div class="lg-row"><span class="lg-log">消費 = <b>ソフト</b>（分岐が同一 prescription を共有）</span></div>
    <div class="lg-row"><span class="lg-log">マーキング = <b>DB 永続</b>（5テーブル）</span></div>`;

  // 接地（写生/接地）＋稼働ゲート（TS設計.md §12: 骨格=普遍構造、ナレッジ=RBP、
  // 全 T 接地=一連に接地=稼働可能（TrueNet）。骨格だけ（ナレッジ未実装）=写生。）
  const R = N.runnability || {};
  const UT = N.universal_transition || {};
  const stages = (UT.stages || []).map(s => escHtml(s.name)).join('→');
  let grounding = '';
  grounding += `<div class="lg-row"><span class="lg-log">骨格（普遍構造）: <b>${stages || '認知→評価→決定→投射→作動'}</b></span></div>`;
  grounding += `<div class="lg-row"><span class="lg-log">作動（<b>${escHtml(UT.essence === 'actuation' ? 'actuation' : UT.essence || 'actuation')}</b>）= T の正体</span></div>`;
  // 各 T のナレッジ（RBP）実装度＋「ナレッジを編集」導線（/knowledge の該当 rbp_*）
  const tids = Object.keys(N.transitions || {});
  tids.forEach(tid => {
    const t = N.transitions[tid];
    const g = t.grounded === true;
    const isAct = (t.actions && t.actions.length);
    const kt = t.knowledge_table;
    const tk = t.task_id;
    // ナレッジ編集導線: /knowledge?task=<タスク>&table=<段>（タスク単位で編集）
    let editLink = '';
    if (kt || tk) {
      const qs = [tk && 'task=' + encodeURIComponent(tk), kt && 'table=' + encodeURIComponent(kt)]
        .filter(Boolean).join('&');
      const label = [tk, kt].filter(Boolean).map(escHtml).join(' / ');
      editLink = ` <a href="/knowledge?${qs}" target="_blank" title="この T のナレッジを編集（${label}）" style="color:var(--accent);text-decoration:none;">✎編集</a>`;
    }
    grounding += `<div class="lg-log"><span class="lg-badge ${g ? 'ok' : 'bad'}">${g ? '接地' : '写生'}</span> `
      + `<span class="ll-tid">${escHtml(t.name || tid)}</span>`
      + (isAct ? ' <span class="lg-badge ok" title="作動（T の正体）">⚡正体</span>' : '')
      + ` <span class="ll-ts">${escHtml(t.knowledge || 'ナレッジ未定義')}</span>${editLink}</div>`;
  });
  // 稼働ゲート
  grounding += `<div class="lg-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;">`
    + `<span class="lg-badge ${R.runnable ? 'ok' : 'bad'}">${R.runnable ? '稼働可能' : '稼働不可'}</span> `
    + `<span class="lg-log">${R.grounded_count ?? 0}/${R.total ?? tids.length} 接地`
    + (R.sketch && R.sketch.length ? `・写生 ${R.sketch.length} T` : '') + `</span></div>`;

  return { order, reflex, replay, os, grounding };
}

// 状態遷移ネット（Petri網）をメイン領域に描画。正は jobnet.py（read-only）。
// ステージ/LangGraphキャンバスは廃止されたため、これが唯一のビュー。
async function openPetriView() {
  try {
    const res = await fetch('/api/net');
    PETRI_NET = await res.json();
  } catch (e) {
    document.getElementById('petriTitle').textContent = '状態遷移ネット（読み込みに失敗）';
    document.getElementById('petriBody').innerHTML = '<div class="petri-legend">/api/net が取得できません: ' + escHtml(e.message) + '</div>';
    return;
  }
  document.getElementById('petriTitle').textContent = PETRI_NET.name || '状態遷移ネット';
  PETRI_EXPANDED = false;
  await loadHumosLog();
  renderPetri();
}

// 列の割り当て: 弧（pre→post）の最大パス長のトポロジカル層。
// 非循環なので必ず確定する。各要素は 1 列に 1 つのみ（複合フレームは独立要素）。
function petriAssignCols() {
  const N = PETRI_NET;
  const trans = N.transitions;
  const nodes = Object.keys(trans);
  const inDeg = {};
  nodes.forEach(n => inDeg[n] = 0);
  (N.edges || []).forEach(([a, b]) => { if (inDeg[b] !== undefined) inDeg[b]++; });
  const col = {};
  nodes.forEach(n => col[n] = 0);
  const q = nodes.filter(n => inDeg[n] === 0);
  const rem = { ...inDeg };
  while (q.length) {
    const n = q.shift();
    (N.edges || []).forEach(([a, b]) => {
      if (a === n) { col[b] = Math.max(col[b], col[n] + 1); rem[b]--; if (rem[b] === 0) q.push(b); }
    });
  }
  // 複合トランジションは「内部チェーンの最初の列」に（フレーム定位は col[t] を使う）
  const composite = {};
  Object.keys(N.composite || {}).forEach(cName => {
    const c = N.composite[cName];
    composite[cName] = {
      col: Math.min(...c.inner.map(t => col[t])),
      inner: c.inner,
      pre: (c.pre || [])[0],
      post: (c.post || [])[0],
      actions: c.actions || [],
    };
  });
  return { col, composite };
}

function renderPetri() {
  const N = PETRI_NET;
  const body = document.getElementById('petriBody');
  const H = 560;
  const yByIndex = i => 130 + i * 70;

  // 発火可能（firing_enabled が無い場合は全部 false 扱い）
  const firing = N.firing_enabled || {};

  // 複合を展開するかで列定義が決まる
  const layout = petriAssignCols();

  // 各プレースの列: 消費するトランジションの enabled_when の列
  const placeCol = {};
  Object.keys(N.places).forEach(pid => {
    const tok = N.places[pid].token_key;
    const consumers = Object.keys(N.transitions).filter(t => (N.transitions[t].enabled_when || []).includes(tok));
    if (consumers.length) placeCol[pid] = Math.min(...consumers.map(t => layout.col[t]));
    else placeCol[pid] = Math.max(...Object.values(layout.col), 0);
  });
  // 列の並べ替え（数値）
  const cols = [...new Set([...Object.values(placeCol), ...Object.values(layout.col)])].sort((a, b) => a - b);

  const X = c => 130 + c * 165;
  const nodes = Object.keys(N.transitions);
  const places = Object.keys(N.places);

  // 外部キー: 複合の「内部」にある中間プレース。内側トランジション1つの post
  // かつ別内側トランジションの pre で、かつ外側のトランジションに接続されていないもの。
  // 本当のプレース（境界・外へ抜ける共有）ではなく、モジュール間の内部データ渡しを
  // 表す「外部キー」という別の概念として、破線・別色で描画する（非表示にはしない）。
  const interiorPlaces = new Set();
  Object.keys(layout.composite).forEach(cName => {
    const innerSet = new Set(layout.composite[cName].inner);
    places.forEach(p => {
      const touching = nodes.filter(t =>
        (N.transitions[t].pre || []).includes(p) || (N.transitions[t].post || []).includes(p));
      if (!touching.length) return;
      if (!touching.every(t => innerSet.has(t))) return; // 外側接続 → 境界（本当のプレース）
      const hasIn = touching.some(t => (N.transitions[t].post || []).includes(p));
      const hasOut = touching.some(t => (N.transitions[t].pre || []).includes(p));
      if (hasIn && hasOut) interiorPlaces.add(p); // 真の中間 = 外部キー
    });
  });

  // 全プレースを描画。内部の中間プレースは「外部キー」スタイルで区別表示する。
  const visiblePlaces = places;

  // 行の割り当て: 各列内の要素（トランジション/プレース）を縦に並べる
  const rowsByCol = {};
  const elCols = {}; // elementId -> col
  nodes.forEach(t => elCols['t:' + t] = layout.col[t]);
  visiblePlaces.forEach(p => elCols['p:' + p] = placeCol[p]);
  Object.keys(elCols).forEach(id => { const c = elCols[id]; (rowsByCol[c] = rowsByCol[c] || []).push(id); });
  // 同一列内: トランジション→プレース順で安定化
  const posOf = {};
  Object.keys(rowsByCol).forEach(c => {
    const ids = rowsByCol[c].sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    ids.forEach((id, i) => posOf[id] = yByIndex(i) - (ids.length - 1) * 35);
  });
  const maxRow = Math.max(...Object.values(posOf)) + 200;
  const Hh = Math.max(H, maxRow);

  // ---- SVG（弧） ----
  const anchors = {}; // elementId -> {x,y,side:'in'|'out'}
  nodes.forEach(t => {
    const x = X(layout.col[t]); const y = posOf['t:' + t];
    anchors['t:' + t + ':in'] = { x: x - 46, y };
    anchors['t:' + t + ':out'] = { x: x + 46, y };
  });
  visiblePlaces.forEach(p => {
    const x = X(placeCol[p]); const y = posOf['p:' + p];
    anchors['p:' + p + ':in'] = { x: x - 31, y };
    anchors['p:' + p + ':out'] = { x: x + 31, y };
  });

  const svgW = X(cols[cols.length - 1]) + 260;
  let svg = `<svg class="petri-svg" width="${svgW}" height="${Hh}">`;
  // 弧: place → transition（pre）と transition → place（post）
  function arc(x1, y1, x2, y2, on) {
    const mx = (x1 + x2) / 2;
    return `<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${on ? 'var(--success)' : 'var(--border)'}" stroke-width="2" marker-end="url(#petriArrow${on ? 'On' : ''})"/>`;
  }
  svg += `<defs>
    <marker id="petriArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--border)"/></marker>
    <marker id="petriArrowOn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--success)"/></marker>
  </defs>`;
  nodes.forEach(t => {
    const on = !!firing[t];
    (N.transitions[t].pre || []).forEach(p => {
      const a = anchors['p:' + p + ':out'], b = anchors['t:' + t + ':in']; svg += arc(a.x, a.y, b.x, b.y, on);
    });
    (N.transitions[t].post || []).forEach(p => {
      const a = anchors['t:' + t + ':out'], b = anchors['p:' + p + ':in']; svg += arc(a.x, a.y, b.x, b.y, on);
    });
  });
  svg += `</svg>`;

  // ---- 複合フレーム（未展開）または内部チェーン（展開） ----
  // フレーム外枠 = inner トランジション ＋ その複合に属する外部キー（中間プレース）の
  // 外接矩形。外部キーは内側トランジションと同じ列・別行に座るため、内側トランジション
  // だけで枠を算定すると上（または下）はみ出してしまうので必ず含める。
  function compositeBox(cName) {
    const inner = layout.composite[cName].inner;
    const innerSet = new Set(inner);
    const xs = inner.map(t => X(layout.col[t]));
    const ys = inner.map(t => posOf['t:' + t]);
    interiorPlaces.forEach(p => {
      const touching = nodes.filter(t =>
        (N.transitions[t].pre || []).includes(p) || (N.transitions[t].post || []).includes(p));
      if (touching.length && touching.every(t => innerSet.has(t))) { xs.push(X(placeCol[p])); ys.push(posOf['p:' + p]); }
    });
    return { xs, ys, inner };
  }
  let frameHtml = '';
  if (PETRI_EXPANDED) {
    // 展開: inner の内部弧＋作動ラベルを表示（要素は既に描画済み）
    Object.keys(layout.composite).forEach(cName => {
      const { xs, ys, inner } = compositeBox(cName);
      const fx = Math.min(...xs) - 60, fy = Math.min(...ys) - 60;
      const fw = Math.max(...xs) - Math.min(...xs) + 120, fh = Math.max(...ys) - Math.min(...ys) + 120;
      frameHtml += `<div class="petri-frame" style="left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px" title="複合: 認知→評価→決定→投射（作動は投射2→在庫→Slack）"></div>`;
      frameHtml += `<div class="petri-frame-label" style="left:${fx}px;top:${fy - 22}px">⛓ ${escHtml(cName)}（展開）</div>`;
      // 内部の弧は上記の「pre→post」弧でそのまま描画（中間の外部キーが可視）
    });
  } else {
    Object.keys(layout.composite).forEach(cName => {
      const { xs, ys } = compositeBox(cName);
      const fx = Math.min(...xs) - 55, fy = Math.min(...ys) - 55;
      const fw = Math.max(...xs) - Math.min(...xs) + 110, fh = Math.max(...ys) - Math.min(...ys) + 110;
      frameHtml += `<div class="petri-frame" onclick="petriToggle()" style="left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px" title="クリックで内部チェーン展開"></div>`;
      frameHtml += `<div class="petri-frame-label" onclick="petriToggle()" style="left:${fx}px;top:${fy - 24}px">⛓ ${escHtml(cName)}{ 認知─評価─決定─投射 } ＋ 作動(Slack)  ▶ 展開</div>`;
      // 内部の弧は上記の「pre→post」弧でそのまま描画（中間の外部キーが可視、トランジション直結は不要）
    });
  }

  // ---- 要素描画 ----
  let nodesHtml = '';
  nodes.forEach(t => {
    const x = X(layout.col[t]) - 46, y = posOf['t:' + t] - 25;
    const on = !!firing[t];
    const sub = (N.transitions[t].actions || []).length
      ? '⚡' + escHtml(N.transitions[t].actions.map(a => a.name).join('、'))
      : escHtml((N.transitions[t].enabled_when || []).join(' / '));
    nodesHtml += `<div class="petri-node-box ${on ? 'enabled' : 'disabled'}" style="left:${x}px;top:${y}px;width:92px" title="${escAttr(t)}">
      <div class="pn-name">${escHtml(N.transitions[t].name)}</div>
      <div class="pn-sub">${sub}</div>
    </div>`;
    // 作動(SoS)ラベル
    (N.transitions[t].actions || []).forEach((a, i) => {
      nodesHtml += `<div class="petri-action" style="left:${x + 92 + 4}px;top:${y + 4 + i * 16}px" title="作動(SoS): ${escAttr(a.handler)}">⚡ ${escHtml(a.name)}</div>`;
    });
  });
  visiblePlaces.forEach(p => {
    const x = X(placeCol[p]) - 31, y = posOf['p:' + p] - 31;
    const cur = N.current_places ? N.current_places[N.places[p].token_key] : null;
    const has = cur != null && cur !== '' && !(Array.isArray(cur) && cur.length === 0);
    const val = has ? '●' : '';
    const isKey = interiorPlaces.has(p); // 外部キー（複合内部の中間データ渡し）
    nodesHtml += `<div class="petri-place ${isKey ? 'petri-key' : ''} ${has ? 'enabled' : ''}" style="left:${x}px;top:${y}px" title="${escAttr(N.places[p].token_key)} @ ${escAttr(N.places[p].store)}">
      <div class="pp-name">${escHtml(N.places[p].name)}</div>
      ${isKey ? '<div class="pp-key">外部キー</div>' : ''}
      <div class="pp-val">${val}</div>
    </div>`;
  });

  const legendPos = PETRI_LEGEND_POS
    ? `style="left:${PETRI_LEGEND_POS.left}px;top:${PETRI_LEGEND_POS.top}px;right:auto${PETRI_LEGEND_OPEN ? '' : ';min-width:0'}"`
    : (PETRI_LEGEND_OPEN ? '' : 'style="top:12px;right:16px;min-width:0"');
  const legend = `<div class="petri-legend" id="petriLegend" ${legendPos}>
    <div class="lg-head" id="petriLegendHead">
      <span class="lg-title">凡例</span>
      <button class="lg-close" onclick="petriLegendToggle()" title="開閉">${PETRI_LEGEND_OPEN ? '×' : '＋'}</button>
    </div>
    ${PETRI_LEGEND_OPEN ? `<div class="lg-body">
    <div class="lg-row"><span style="display:inline-block;width:14px;height:14px;border:2px solid var(--cog);border-radius:50%"></span> プレース（トークン集約・境界）</div>
    <div class="lg-row"><span style="display:inline-block;width:14px;height:14px;border:2px dashed var(--warn);border-radius:50%"></span> 外部キー（モジュール間・内部データ渡し）</div>
    <div class="lg-row"><span style="display:inline-block;width:14px;height:14px;background:var(--accent);border-radius:3px"></span> トランジション</div>
    <div class="lg-row"><span style="color:var(--success)">→</span> 発火可能（入力トークン揃う）</div>
    <div class="lg-row">⚡ 作動（SoS: 物理界へ）</div>
    <div class="lg-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;">
      <button class="btn btn-sm" style="width:auto;font-size:10px;" onclick="petriToggle()">${PETRI_EXPANDED ? '◀ 折りたたみ' : '▶ 複合展開'}</button>
      <button class="btn btn-sm" style="width:auto;font-size:10px;" onclick="openPetriView()">🔄</button>
    </div>
  </div>` : ''}
  </div>`;

  // ---- HUMOS ログパネル（発火ログ・作動ログ・マーキング） ----
  const HUM = PETRI_HUMOS || {};
  const rows = humosLogRows();
  // 右下配置（CSS #petriHumos が top:auto;bottom:12px）。ドラッグ時は left/top を
  // 明示し top:auto を維持（bottom と両立して伸びない）。
  const humosPos = PETRI_HUMOS_POS
    ? `style="left:${PETRI_HUMOS_POS.left}px;top:${PETRI_HUMOS_POS.top}px;bottom:auto;right:auto${PETRI_HUMOS_OPEN ? '' : ';min-width:0'}"`
    : (PETRI_HUMOS_OPEN ? '' : 'style="right:16px;min-width:0"');
  const humosPanel = `<div class="petri-legend" id="petriHumos" ${humosPos}>
    <div class="lg-head" id="petriHumosHead">
      <span class="lg-title">📋 HUMOS ログ <span class="lg-badge ${HUM.replay_ok ? 'ok' : 'bad'}" title="マーキング ≡ M0 からのリプレイ（整合）">${HUM.replay_ok ? '整合' : '未整合'}</span></span>
      <button class="lg-close" onclick="petriHumosToggle()" title="開閉">${PETRI_HUMOS_OPEN ? '×' : '＋'}</button>
    </div>
    ${PETRI_HUMOS_OPEN ? `<div class="lg-body" style="max-height:60vh;overflow:auto;">
    <div class="lg-sec">マーキング（M）</div>
    ${rows.marking}
    <div class="lg-sec">発火ログ（${(HUM.firing_log || []).length} 件・最新20）</div>
    ${rows.firing}
    <div class="lg-sec">作動ログ（SOS・${(HUM.sos_log || []).length} 件）</div>
    ${rows.sos}
    <div class="lg-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">
      <button class="btn btn-sm" style="width:auto;font-size:10px;" onclick="openPetriView()">🔄 更新</button>
    </div>
  </div>` : ''}
  </div>`;

  // ---- 真界（TN）パネル（発火順序・在庫リフレックス・リプレイ整合・OS同一性） ----
  // 左サイドバー（フロー内で幅を確保し、ペトリネットと重ならない）。
  const tn = trueNetRows();
  const tnPanel = `<div class="petri-legend${PETRI_TN_OPEN ? '' : ' tn-collapsed'}" id="petriTn">
    <div class="lg-head" id="petriTnHead">
      <span class="lg-title">🌍 真界（TN） <span class="lg-badge ${HUM.replay_ok ? 'ok' : 'bad'}" title="マーキング ≡ M0 からのリプレイ（整合）">${HUM.replay_ok ? '整合' : '未整合'}</span></span>
      <button class="lg-close" onclick="petriTnToggle()" title="開閉">${PETRI_TN_OPEN ? '×' : '＋'}</button>
    </div>
    ${PETRI_TN_OPEN ? `<div class="lg-body">
    <div class="lg-sec">接地（写生/接地）＋稼働ゲート（§12）</div>
    ${tn.grounding}
    <div class="lg-sec">発火順序（マーキング駆動）</div>
    ${tn.order}
    <div class="lg-sec">在庫リフレックス（間接的開き）</div>
    ${tn.reflex}
    <div class="lg-sec">リプレイ整合（不変条件5）</div>
    ${tn.replay}
    <div class="lg-sec">OS（DC/STB 同一）</div>
    ${tn.os}
    <div class="lg-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">
      <button class="btn btn-sm" style="width:auto;font-size:10px;" onclick="openPetriView()">🔄 更新</button>
    </div>
  </div>` : ''}
  </div>`;

  // 中身は全て position:absolute なので、フロー内コンテンツが 0 になる。
  // 明示的な寸法の relative ラッパーでスクロール領域を確定させないと body 幅が 0px 化し全要素がクリップされる。
  // 真界（TN）パネルは左サイドバー（フロー内）なので canvas より前に並べる。
  // 凡例・HUMOSログは position:absolute のオーバーレイ（フロー外）なので DOM 順は canvas 後でよい。
  body.innerHTML = tnPanel + `<div id="petriCanvas" style="position:relative;width:${svgW}px;height:${Hh}px">${svg + nodesHtml + frameHtml}</div>` + legend + humosPanel;
  // 浮動パネルヘッダへのドラッグ（innerHTML 再生成のたびに再接続）
  const lh = document.getElementById('petriLegendHead');
  if (lh) lh.addEventListener('mousedown', petriLegendDragStart);
  const hh = document.getElementById('petriHumosHead');
  if (hh) hh.addEventListener('mousedown', petriHumosDragStart);
  // 真界（TN）パネルは左サイドバー（位置固定）のためドラッグしない。
}

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════

initSidebar();
openPetriView();
</script>
</body>
</html>
